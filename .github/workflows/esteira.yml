name: Esteira Nuvemshop

on:
  push:
    branches: [main]
    paths: ["jobs/**.json"]
  workflow_dispatch:
    inputs:
      job:
        description: "Caminho do job (ex.: jobs/001-teste.json)"
        required: true

concurrency:
  group: esteira-nuvemshop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descobrir jobs
        id: jobs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "lista=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            L=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.json' | tr '\n' ' ')
            echo "lista=$L" >> "$GITHUB_OUTPUT"
          fi

      - name: Executar
        if: steps.jobs.outputs.lista != ''
        env:
          NUVEMSHOP_TOKEN: ${{ secrets.NUVEMSHOP_TOKEN }}
          NUVEMSHOP_STORE_ID: "6361192"
        run: python esteira/nuvemshop.py ${{ steps.jobs.outputs.lista }}

      - name: Salvar relatórios
        if: always() && steps.jobs.outputs.lista != ''
        run: |
          git config user.name "esteira-bot"
          git config user.email "esteira-bot@users.noreply.github.com"
          git add relatorios || true
          git diff --cached --quiet || (git commit -m "Relatório da esteira [skip ci]" && git push)
